name: lab9-basic-tests
on:
  push:
    branches: [ "main", "test" ]

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        
      - name: Make script executable
        run: chmod +x validate-data.sh
        
      - name: Run and verify output
        run: |
          OUTPUT=$(bash validate-data.sh "pearse mccarthy" "0831122334")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" == "PASS" ]; then echo "Test Passed!"; else echo "Test Failed"; exit 1; fi
          
          OUTPUT=$(bash validate-data.sh "this name is definitely over twenty chars" "0831122334")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" == "FAIL" ]; then echo "Test Passed!"; else echo "Test Failed"; exit 1; fi
          
          OUTPUT=$(bash validate-data.sh "pearse" "0831122334")
          echo "Script output was: $OUTPUT"
          if [ "$OUTPUT" == "PASS" ]; then echo "Test Passed!"; else echo "Test Failed"; exit 1; fi
